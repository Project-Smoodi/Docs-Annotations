name: Gradle Publishing

on:
  release:
    types: [ created ]
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: startsWith(github.event.head_commit.message, 'SNAPSHOT') || startsWith(github.event.head_commit.message, 'RELEASE')

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradlew Permission
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Ultimate Authentication Test with cURL
        run: |
          echo "Attempting to authenticate with user: ${{ secrets.OSSRH_USERNAME }}"
          curl -v -u "${{ secrets.OSSRH_USERNAME }}:${{ secrets.OSSRH_PASSWORD }}" https://s01.oss.sonatype.org/service/local/authentication/login

      - name: Publish to Maven Central
        run: ./gradlew publish --stacktrace --info
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
