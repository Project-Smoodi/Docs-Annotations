name: Gradle Publishing

on:
  release:
    types: [ created ]
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: startsWith(github.event.head_commit.message, 'SNAPSHOT') || startsWith(github.event.head_commit.message, 'RELEASE')

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradlew Permission
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Set up GPG Environment
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" > key |
          gpg --import --pinentry-mode loopback --passphrase-fd 0 key |
          echo "${{ secrets.GPG_PASSPHRASE }}"
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: ./gradlew publish --stacktrace
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signing_keyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signing_password: ${{ secrets.GPG_PASSPHRASE }}
